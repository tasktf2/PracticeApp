plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    compileSdk = 36
    namespace = 'com.setjy.practiceapp'

    defaultConfig {
        applicationId = "com.setjy.practiceapp"
        minSdk = 26
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
    }

    // ---------- Build features ----------
    buildFeatures {
        viewBinding = true
        compose = true
    }

    // ---------- Compose options ----------
    composeOptions {
        kotlinCompilerExtensionVersion = compose_version
    }

    kapt {
        correctErrorTypes = true
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'com.github.kirich1409:viewbindingpropertydelegate:1.4.6'

    implementation 'io.reactivex.rxjava3:rxjava:3.1.4'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'com.jakewharton.rxrelay3:rxrelay:3.0.1'

    // Compose
    implementation "androidx.compose.ui:ui:1.10.4"
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.activity:activity-compose:1.12.4"
    implementation "androidx.compose.runtime:runtime-rxjava3:1.7.8"

    // Coil
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation 'androidx.compose.ui:ui-tooling-preview:1.10.6'

    // Debug
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.8.1"
    debugImplementation 'androidx.compose.ui:ui-tooling:1.10.6'

    // Navigation
    def nav = "2.3.5"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav"
    implementation "androidx.navigation:navigation-ui-ktx:$nav"

    // Retrofit
    def retrofit = "2.9.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofit"
    implementation "com.squareup.retrofit2:adapter-rxjava3:$retrofit"
    implementation "com.squareup.retrofit2:converter-gson:2.4.0"

    // OkHttp
    def okhttp = "5.0.0-alpha.2"
    implementation "com.squareup.okhttp3:okhttp:$okhttp"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp"

    // Glide
    def glide = "4.15.1"
    implementation "com.github.bumptech.glide:glide:$glide"
    kapt "com.github.bumptech.glide:compiler:$glide"

    // Shimmer
    implementation "com.facebook.shimmer:shimmer:0.5.0"

    // Room
    def room = "2.5.2"
    implementation "androidx.room:room-runtime:$room"
    implementation "androidx.room:room-rxjava3:$room"
    kapt "androidx.room:room-compiler:$room"

    // Dagger
    def dagger = "2.48"
    implementation "com.google.dagger:dagger:$dagger"
    kapt "com.google.dagger:dagger-compiler:$dagger"
}